name: Verify
on: [push, pull_request, workflow_dispatch]
jobs:
  test:
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - name: Linux isolation prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap ripgrep
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: macOS integration suite
        if: runner.os == 'macOS'
        env:
          PSI_CHROME_PATH: /Applications/Google Chrome.app/Contents/MacOS/Google Chrome
        run: npm test
      - name: Portable core and workflow tests
        if: runner.os != 'macOS'
        run: node --test --test-timeout=30000 test/usage.test.mjs test/workflow.test.mjs test/layout.test.mjs test/panels.test.mjs test/stats.test.mjs test/resets.test.mjs test/model-workers.test.mjs test/conversation.test.mjs test/final-review.test.mjs test/usage-comparison.test.mjs
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm run release:build
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/psi-*.tar.gz
            dist/SHA256SUMS
            scripts/install.sh
            scripts/install.ps1
            scripts/install.mjs
